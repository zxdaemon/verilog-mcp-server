[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verilog-mcp-server"
version = "0.1.0"
description = "Verilog/SystemVerilog RTL 代码语义分析 MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20.0",
    "tree-sitter>=0.25,<0.26",  # 核心包锁定 0.25：代码已迁移到 0.25 属性 API；language-pack 仅要求 >=0.23，无上界会漂移
    "tree-sitter-language-pack>=1.12,<2",  # 锁 1.12 大版本：systemverilog ABI=15 实证；无上界曾致 core 0.23→0.25 漂移
    "pyyaml>=6.0",
    "pyslang>=11.0.0,<12.0.0",
]

[project.scripts]
verilog-mcp-server = "verilog_mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.setuptools.packages.find]
include = ["verilog_mcp_server*"]

[tool.setuptools.package-data]
verilog_mcp_server = ["*.yaml", "*.yml"]
"verilog_mcp_server.templates" = ["*.html"]
